# ============================================================
# BOKS 生产环境 Nginx 配置（TLS 终止）
# 服务器：腾讯云广州  公网 IPv4 152.136.218.37 / IPv6 2402:4e00:c050:1f00:24e0:1ddc:da5e:0
# 域名：
#   api.boks-ai.com.cn   API + 小程序 request 合法域名
#   www.boks-ai.com.cn   小程序前端 + 官网
#   boks-ai.com.cn       根域（301 → www）
#   ai.boks-ai.com.cn    AI 服务
# 证书：certbot --nginx -d api.boks-ai.com.cn -d www.boks-ai.com.cn -d boks-ai.com.cn -d ai.boks-ai.com.cn
# ============================================================

# ---------- HTTP → HTTPS 统一跳转 ----------
server {
    listen 80;
    listen [::]:80;
    server_name api.boks-ai.com.cn www.boks-ai.com.cn boks-ai.com.cn ai.boks-ai.com.cn;

    # HTTP → HTTPS
    location / {
        return 301 https://$host$request_uri;
    }

    # Let's Encrypt 校验
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}

# ---------- api.boks-ai.com.cn → API（主） ----------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.boks-ai.com.cn;

    # TLS 证书（certbot 自动续期）
    ssl_certificate     /etc/letsencrypt/live/api.boks-ai.com.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.boks-ai.com.cn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling        on;
    ssl_stapling_verify on;

    # 安全响应头
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # SSE 长连接
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header Connection "";
    }

    # 热更新静态文件（manifest.json / *.zip）
    location ^~ /updates/ {
        alias /var/www/boks-ai.com.cn/updates/;
        default_type application/json;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=300";
        add_header Access-Control-Allow-Origin "*" always;
    }
}

# ---------- www.boks-ai.com.cn → 小程序/官网（静态 + API 反代） ----------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.boks-ai.com.cn boks-ai.com.cn;

    ssl_certificate     /etc/letsencrypt/live/www.boks-ai.com.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.boks-ai.com.cn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling        on;
    ssl_stapling_verify on;

    # 安全响应头
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # SSE 长连接
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header Connection "";
    }

    # 热更新静态文件（manifest.json / *.zip）
    location ^~ /updates/ {
        alias /var/www/boks-ai.com.cn/updates/;
        default_type application/json;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=300";
        add_header Access-Control-Allow-Origin "*" always;
    }

    # 健康检查
    location = /v1/health {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
    }
    location = /v1/health/ready {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
    }

    # www 域根路径直接跳到 API 子域（小程序正式入口在 api 子域）
        location = / {
            return 302 https://api.boks-ai.com.cn/;
        }
    }

    # ---------- ai.boks-ai.com.cn → AI 服务（如不使用可删除）----------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ai.boks-ai.com.cn;

    ssl_certificate     /etc/letsencrypt/live/ai.boks-ai.com.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai.boks-ai.com.cn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_set_header Connection "";
    }
}
