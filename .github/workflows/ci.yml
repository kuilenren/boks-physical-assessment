name: CI

on:
  push:
    branches: ["main", "develop", "feature/**"]
  pull_request:

permissions:
  contents: read

env:
  BOKS_DATABASE_URL: postgresql://boks:boks-local-only@localhost:5432/boks
  BOKS_AI_SERVICE_URL: http://127.0.0.1:8001
  BOKS_REDIS_URL: redis://localhost:6379

jobs:
  typescript:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: boks
          POSTGRES_PASSWORD: boks-local-only
          POSTGRES_DB: boks
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U boks" --health-interval 10s --health-timeout 3s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 3s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm --filter @boks/api migrate:up
      - run: pnpm --filter @boks/design-tokens build
      - run: pnpm --filter @boks/design-tokens exec node verify-tokens.cjs
      - run: pnpm --filter @boks/api test
      - run: node tests/regression/auth.test.mjs || true

  miniprogram:
    runs-on: ubuntu-latest
    env:
      # 生产构建必须注入真实 API 域名（http.ts 会拒绝占位域名）；
      # 上线时由部署流程替换为正式域名。
      TARO_APP_API_BASE_URL: https://api.boks.fit/v1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @boks/miniprogram typecheck
      - run: pnpm --filter @boks/miniprogram build:weapp
      - run: pnpm --filter @boks/miniprogram verify:dist

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug --dart-define=BOKS_API_BASE_URL=https://api.example.invalid/v1

  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: boks
          POSTGRES_PASSWORD: boks-local-only
          POSTGRES_DB: boks
        ports: ["5432:5432"]
    defaults:
      run:
        working-directory: services/ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: boks
          POSTGRES_PASSWORD: boks-local-only
          POSTGRES_DB: boks
        ports: ["5432:5432"]
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - run: pip install -e "services/ai[dev]"
      - run: pnpm --filter @boks/api migrate:up
      - run: cd services/api && nohup npx tsx src/main.ts &
      - run: cd services/ai && nohup python -m boks_ai.stream_server &
      - run: sleep 8
      - run: node tests/smoke/smoke.mjs
      - run: node tests/e2e/full-flow.test.mjs
      - run: node tests/ab/run.mjs
      - run: node tests/regression/auth.test.mjs
