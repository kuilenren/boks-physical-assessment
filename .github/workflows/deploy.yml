name: Deploy (SSL + Production)

on:
  push:
    branches: ["main", "release/**"]
  workflow_dispatch:
    inputs:
      domain:
        description: "Production domain (e.g., boks.example.com)"
        required: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy with SSL
        run: |
          DOMAIN="${{ github.event.inputs.domain || github.ref_name }}"
          scp -o StrictHostKeyChecking=no \
            infra/docker-compose.production.yml \
            infra/deploy-ssl.sh \
            infra/nginx/conf.d/*.conf \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/boks/
          ssh -o StrictHostKeyChecking=no ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "cd /opt/boks && bash deploy-ssl.sh ${DOMAIN}"
